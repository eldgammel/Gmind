<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mGame | Тест Струпа</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/test-stroop.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header__wrapper">
                <a href="index.html" class="logo">mGame</a>
            </div>
        </div>
    </header>

    <main class="stroop-page">
        <section class="stroop">
            <div class="container">
                <div class="stroop__wrapper">

                    <div class="stroop__top">
                        <a href="index.html" class="stroop__back">← Назад на главную</a>
                        <p class="stroop__subtitle">Когнитивная мини-игра</p>
                        <h1 class="stroop__title">Тест Струпа</h1>
                        <p class="stroop__text">
                            На этой странице позже будет отображаться слово с цветом текста,
                            а игрок должен будет выбрать правильный ответ по правилам теста.
                        </p>
                    </div>

                    <div class="stroop__card">
                        <div class="stroop__content">

                            <div class="stroop__task">
                                <span class="stroop__task-label">Стимул</span>
                                <p class="stroop__task-word">КРАСНЫЙ</p>
                            </div>

                            <div class="stroop__answers">
                                <button class="stroop__button">Красный</button>
                                <button class="stroop__button">Синий</button>
                                <button class="stroop__button">Зелёный</button>
                                <button class="stroop__button">Жёлтый</button>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2026 mGame. Учебный проект для практики JavaScript.</p>
        </div>
    </footer>

    <script src="js/logic.js"></script>
</body>
</html>
