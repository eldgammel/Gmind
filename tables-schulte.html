<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mGame | Таблицы Шульте</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tables-schulte.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header__wrapper">
                <a href="index.html" class="logo">mGame</a>
            </div>
        </div>
    </header>

    <main class="schulte-page">
        <section class="schulte">
            <div class="container">
                <div class="schulte__wrapper">

                    <div class="schulte__top">
                        <a href="index.html" class="schulte__back">← Назад на главную</a>
                        <p class="schulte__subtitle">Когнитивная мини-игра</p>
                        <h1 class="schulte__title">Таблицы Шульте</h1>
                        <p class="schulte__text">
                            На этой странице позже будет игровая таблица с числами.
                            Пользователь должен будет находить числа по порядку как можно быстрее.
                        </p>
                    </div>

                    <div class="schulte__card">
                        <div class="schulte__content">

                            <div class="schulte__info">
                                <div class="schulte__info-item">
                                    <span class="schulte__info-label">Размер</span>
                                    <span class="schulte__info-value">5 × 5</span>
                                </div>

                                <div class="schulte__info-item">
                                    <span class="schulte__info-label">Цель</span>
                                    <span class="schulte__info-value">Найти 1 → 25</span>
                                </div>
                            </div>

                            <div class="schulte__grid">
                                <button class="schulte__cell">7</button>
                                <button class="schulte__cell">18</button>
                                <button class="schulte__cell">2</button>
                                <button class="schulte__cell">24</button>
                                <button class="schulte__cell">10</button>

                                <button class="schulte__cell">15</button>
                                <button class="schulte__cell">1</button>
                                <button class="schulte__cell">20</button>
                                <button class="schulte__cell">5</button>
                                <button class="schulte__cell">13</button>

                                <button class="schulte__cell">21</button>
                                <button class="schulte__cell">9</button>
                                <button class="schulte__cell">16</button>
                                <button class="schulte__cell">3</button>
                                <button class="schulte__cell">25</button>

                                <button class="schulte__cell">11</button>
                                <button class="schulte__cell">6</button>
                                <button class="schulte__cell">22</button>
                                <button class="schulte__cell">14</button>
                                <button class="schulte__cell">4</button>

                                <button class="schulte__cell">19</button>
                                <button class="schulte__cell">8</button>
                                <button class="schulte__cell">12</button>
                                <button class="schulte__cell">23</button>
                                <button class="schulte__cell">17</button>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2026 mGame. Учебный проект для практики JavaScript.</p>
        </div>
    </footer>

    <script src="js/logic.js"></script>
</body>
</html>
